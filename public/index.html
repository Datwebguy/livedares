<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<title>LiveDares</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb62e"/><stop offset="1" stop-color="#ff3d2e"/></linearGradient>
  <mask id="mm"><rect width="64" height="64" fill="#fff"/><circle cx="21" cy="32" r="5.5" fill="#000"/>
    <path class="sig s1" d="M30.2 22.8A13 13 0 0 1 30.2 41.2" fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
    <path class="sig s2" d="M36.6 16.4A22 22 0 0 1 36.6 47.6" fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M39 3L63 27" stroke="#000" stroke-width="3.4"/></mask>
  <symbol id="mark" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="url(#mg)" mask="url(#mm)"/></symbol>
</defs></svg>

<canvas id="flow" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<header class="top">
  <a class="brand" href="/" aria-label="LiveDares"><svg class="mark" aria-hidden="true"><use href="#mark"/></svg><span class="word">Live<b>Dares</b></span></a>
  <div class="top-right">
    <div class="conn" id="connection" role="status"><i></i><span id="connection-title">Connecting</span><small id="connection-detail"></small></div>
    <a class="link" href="/overlay" target="_blank" rel="noopener">Stream overlay <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Chat dares.<br><span>You do it.</span></h1>
    <p class="lede">A viewer types an idea in chat. It becomes a short, timed dare. You do it live, mark how it went, and the viewer who thought of it earns points.</p>
    <p class="cmd"><span>Tell your chat</span><code>!challenge &lt;your idea&gt;</code><button class="copy" id="copy" type="button" aria-label="Copy chat command"><span id="copy-text">Copy</span></button></p>
  </section>

  <div class="layout">
    <section class="stage" id="stage" aria-live="polite">
      <div class="head"><span class="label">On deck</span><span class="pill" id="challenge-status"><i></i><b>Waiting</b></span></div>
      <div class="stage-body" id="challenge-body"></div>
      <div class="buttons">
        <button class="btn done" id="done" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Done</button>
        <button class="btn fail" id="fail" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>Failed</button>
        <button class="btn quiet" id="clear" disabled>Skip it</button>
      </div>
    </section>

    <aside class="board" aria-label="Leaderboard">
      <div class="head"><span class="label">Leaderboard</span></div>
      <div id="leaderboard" class="board-list"></div>
    </aside>
  </div>

  <footer class="foot"><svg class="mark small" aria-hidden="true"><use href="#mark"/></svg><span class="word small">Live<b>Dares</b></span></footer>
</main>

<div id="toast" role="status"></div>
<script src="/bg.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
