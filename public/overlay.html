<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveDares · Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/overlay.css">
</head>
<body class="overlay-page">
<canvas id="confetti" aria-hidden="true"></canvas>

<aside class="ov-board" id="ov-board" aria-label="Leaderboard">
  <div class="ov-board-head"><img src="/logo.svg" alt=""><span>Top dare-givers</span></div>
  <div id="overlay-leaderboard" class="ov-list"></div>
</aside>

<section class="ov-card" id="ov-card" data-state="idle">
  <div class="ov-top">
    <span class="ov-tag" id="overlay-meta">Chat is in control</span>
    <div class="ov-clock" id="ov-ring"><strong id="overlay-time">--:--</strong><small id="overlay-timer-label">Waiting</small></div>
  </div>
  <h1 id="overlay-title">Waiting for chat</h1>
  <p id="overlay-description">Type <b>!challenge</b> and your idea.</p>
  <div class="ov-fuse"><i id="ov-arc"></i></div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
